[package]
name = "mcp-email"
version = "1.7.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Email MCP Server — multi-backend sending (SMTP, AWS SES, SendGrid, Gmail, Microsoft Graph) with inbox reading and management"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-email"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "email", "gmail", "microsoft-graph", "adk"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
schemars = "1"
async-imap = "0.11"
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
mailparse = "0.15"
mail-builder = "0.3"
base64ct = { version = "1", features = ["alloc"] }
webpki-roots = "0.26"
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
open = "5"
dirs = "6"

[workspace]
