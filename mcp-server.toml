server_id = "mcp_email"
display_name = "Email"
version = "1.6.0"
domain = "communication"
sdk_version = "0.2.0"
risk_level = "high"
writes_allowed = "gated"
transports = ["stdio"]
credentials = ["vault://gmail-token", "vault://ms-graph-token"]
governance_gates = ["mrtr_approval"]
environments = ["development", "staging", "production"]

[[tools]]
name = "send_email"
description = "Send an email (supports plain text, HTML, CC, BCC). Uses configured backend."
risk_class = "external_write"
requires_approval = true
credential_bindings = ["vault://gmail-token", "vault://ms-graph-token"]

[[tools]]
name = "list_inbox"
description = "List inbox messages"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://gmail-token", "vault://ms-graph-token"]

[[tools]]
name = "get_email"
description = "Get a specific email by ID"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://gmail-token", "vault://ms-graph-token"]

[[tools]]
name = "search_emails"
description = "Search emails by query"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://gmail-token", "vault://ms-graph-token"]

[[tools]]
name = "reply_to_email"
description = "Reply to an email"
risk_class = "external_write"
requires_approval = true
credential_bindings = ["vault://gmail-token", "vault://ms-graph-token"]

[[tools]]
name = "list_labels"
description = "List email labels/folders"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://gmail-token", "vault://ms-graph-token"]

[[tools]]
name = "move_to_folder"
description = "Move an email to a folder/label"
risk_class = "external_write"
requires_approval = true
credential_bindings = ["vault://gmail-token", "vault://ms-graph-token"]

[[tools]]
name = "mark_read"
description = "Mark an email as read"
risk_class = "external_write"
requires_approval = true
credential_bindings = ["vault://gmail-token", "vault://ms-graph-token"]

[[tools]]
name = "get_attachments"
description = "Get attachments for an email"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://gmail-token", "vault://ms-graph-token"]

[[tools]]
name = "forward_email"
description = "Forward an email to new recipients"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "create_draft"
description = "Create a draft email without sending"
risk_class = "generated_write_draft"
requires_approval = true
credential_bindings = []

[[tools]]
name = "list_drafts"
description = "List saved drafts"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "send_draft"
description = "Send a saved draft"
risk_class = "generated_write_draft"
requires_approval = true
credential_bindings = []

[[tools]]
name = "delete_email"
description = "Delete an email (trash or permanent)"
risk_class = "internal_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "mark_unread"
description = "Mark an email as unread"
risk_class = "internal_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "star_email"
description = "Star/flag an email"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_email_body"
description = "Get full email body content (HTML or text)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_thread"
description = "Get email thread/conversation"
risk_class = "read_only"
requires_approval = false
